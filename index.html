<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Performance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body class="app-loading">

<div id="appLoading" class="app-loading-screen"><div class="app-loading-spinner"></div></div>

<div id="sidebar">
  <div class="pin-row">
    <button class="pin-btn" id="sidebarPinBtn" type="button" aria-label="Pin sidebar"></button>
  </div>
  <div class="brand">
    <div class="brand-mark" style="gap:10px;">
      <div id="logoWrap" style="display:flex;align-items:center;flex-shrink:0;"></div>
      <span id="brandName" class="brand-text"></span>
    </div>
    <div class="brand-sub brand-text">Performance Console</div>
  </div>
  <nav id="navList"></nav>
  <div class="sidebar-foot">
    <div id="loggedInAsLabel" style="font-size:11px;color:var(--text-dim);margin-bottom:8px;display:none;"></div>
    <button class="btn btn-ghost btn-sm" id="themeToggleBtn" style="width:100%;justify-content:center;margin-bottom:6px;"></button>
    <button class="btn btn-ghost btn-sm" id="logoutBtn" style="width:100%;justify-content:center;margin-bottom:10px;display:none;">🚪 Logout</button>
    <span class="sync-dot" id="syncDot"></span><span id="syncStatusText">Saved locally in this browser</span>
  </div>
</div>

<div id="main">
  <div class="topbar">
    <div>
      <h1 id="pageTitle"></h1>
      <div class="period" id="pagePeriod">—</div>
      <div id="periodPickerWrap" style="display:flex;align-items:center;gap:6px;margin-top:8px;"></div>
    </div>
    <div class="section-actions" id="topbarActions"></div>
  </div>
  <div class="content" id="content"></div>
</div>

<nav id="bottomNav" class="bottom-nav"></nav>
<div id="moreSheetOverlay" class="more-sheet-overlay"></div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.min.js"></script>
<script src="js/state.js"></script>
<script src="js/auth.js"></script>
<script src="js/firebase.js"></script>
<script src="js/utils.js"></script>
<script src="js/roster.js"></script>
<script src="js/import-export.js"></script>
<script src="js/daily.js"></script>
<script src="js/dailysummary.js"></script>
<script src="js/leave.js"></script>
<script src="js/reports.js"></script>
<script src="js/history.js"></script>
<script src="js/ews.js"></script>
<script src="js/audit.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/breaks.js"></script>
<script src="js/documentation.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
